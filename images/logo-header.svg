<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-label="Yehonam Suds, Hair &amp; Body">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7DC86"/>
      <stop offset="0.45" stop-color="#E8B84B"/>
      <stop offset="1" stop-color="#C08A22"/>
    </linearGradient>
    <linearGradient id="goldFlat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2CE6A"/>
      <stop offset="1" stop-color="#D9A93C"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E6B3B"/>
      <stop offset="1" stop-color="#084D29"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="560" fill="#000000"/>

  <!-- monogram -->
  <g>
    <path d="M110 130 L160 130 Q230 130 230 200 L230 440 L180 440 Q110 440 110 370 Z"
