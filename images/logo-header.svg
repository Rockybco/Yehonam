    <rect x="243" y="120" width="84" height="325" rx="5" fill="url(#gold)"/>
    <path d="M338 265 L388 265 Q448 265 448 325 L448 442 L338 442 Z"
          fill="url(#green)" stroke="url(#goldFlat)" stroke-width="11"/>
  </g>

  <!-- wordmark -->
  <text x="485" y="437" font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
        font-style="italic" font-size="300" fill="url(#gold)" letter-spacing="4">yehonam</text>
</svg>
