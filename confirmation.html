<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order Status — Yehonam Suds, Hair & Body</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="confirmation">

  <nav class="navbar" id="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-logo"><img src="images/logo.svg" alt="Yehonam Suds, Hair &amp; Body"></a>
      <ul class="navbar-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="navbar-actions">
        <a href="cart.html" style="position:relative" aria-label="Cart">
          <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <span class="cart-count">0</span>
        </a>
      </div>
    </div>
  </nav>

  <section class="confirmation-section" id="confirmation-wrap">
    <div class="container">
      <div id="confirmation-loading" class="confirmation-loading" role="status" aria-live="polite">
        <div class="spinner"></div>
        <p>Verifying your order with Stripe...</p>
      </div>
      <div id="confirmation-result" class="confirmation-result" hidden></div>
      <noscript>
        <h1>JavaScript Required</h1>
        <p>This page verifies your order securely with Stripe. Please enable JavaScript, or contact support with your Stripe receipt.</p>
        <div class="confirmation-actions">
          <a href="contact.html" class="btn btn-primary">Contact Support</a>
        </div>
      </noscript>
    </div>
  </section>

  <footer class="footer" style="margin-top:80px">
    <div class="container">
      <div class="footer-bottom"><p style="color:rgba(255,255,255,0.4)">© 2026 Yehonam Suds, Hair &amp; Body. All Rights Reserved.</p></div>
    </div>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/confirmation.js"></script>
</body>
</html>
